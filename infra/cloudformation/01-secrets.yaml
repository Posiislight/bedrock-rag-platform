AWSTemplateFormatVersion: "2010-09-09"
Description: Secrets Manager - API key that clients must send in the X-API-Key header.

Parameters:
  ProjectName:
    Type: String
    Default: llm-platform

Resources:
  ApiKeySecret:
    Type: AWS::SecretsManager::Secret
    Properties:
      Name: !Sub "${ProjectName}/api-key"
      Description: API key for the LLM service (generated, never in source control)
      GenerateSecretString:
        PasswordLength: 40
        ExcludePunctuation: true

Outputs:
  ApiKeySecretArn:
    Value: !Ref ApiKeySecret
    Export:
      Name: !Sub "${ProjectName}-ApiKeySecretArn"
