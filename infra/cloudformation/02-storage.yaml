AWSTemplateFormatVersion: "2010-09-09"
Description: Storage - S3 bucket (documents, vector index, app artifacts) and DynamoDB table (async job state).

Parameters:
  ProjectName:
    Type: String
    Default: llm-platform

Resources:
  DataBucket:
    Type: AWS::S3::Bucket
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      BucketName: !Sub "${ProjectName}-data-${AWS::AccountId}-${AWS::Region}"
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      VersioningConfiguration:
        Status: Enabled

  DataBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref DataBucket
      PolicyDocument:
        Statement:
          - Sid: DenyInsecureTransport
            Effect: Deny
            Principal: "*"
            Action: "s3:*"
            Resource:
              - !GetAtt DataBucket.Arn
              - !Sub "${DataBucket.Arn}/*"
            Condition:
              Bool:
                "aws:SecureTransport": "false"

  JobsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub "${ProjectName}-jobs"
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: job_id
          AttributeType: S
      KeySchema:
        - AttributeName: job_id
          KeyType: HASH
      TimeToLiveSpecification:
        AttributeName: expires_at
        Enabled: true
      SSESpecification:
        SSEEnabled: true

Outputs:
  DataBucketName:
    Value: !Ref DataBucket
    Export:
      Name: !Sub "${ProjectName}-DataBucketName"
  DataBucketArn:
    Value: !GetAtt DataBucket.Arn
    Export:
      Name: !Sub "${ProjectName}-DataBucketArn"
  JobsTableName:
    Value: !Ref JobsTable
    Export:
      Name: !Sub "${ProjectName}-JobsTableName"
  JobsTableArn:
    Value: !GetAtt JobsTable.Arn
    Export:
      Name: !Sub "${ProjectName}-JobsTableArn"
